spring.application.name=ecommerce

# --- Oracle (contenedor docker-compose en la raiz del repo) ---
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:lovely_girl}
spring.datasource.password=${DB_PASSWORD:LovelyGirl_2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# El esquema lo crea Flyway (db/migration); Hibernate solo valida que coincida
# con las entidades JPA, nunca genera ni altera tablas por su cuenta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false
# RF-01.5: nunca registrar sentencias SQL con sus parametros (podrian incluir hashes).
spring.jpa.show-sql=false

spring.flyway.enabled=true

# --- F-01: autenticacion y gestion de roles ---
# RF-01.5: factor de costo de bcrypt (minimo 10; la aplicacion no arranca con menos).
app.autenticacion.bcrypt-costo=${BCRYPT_COSTO:12}
# RF-01.6: la sesion vence tras 30 minutos sin actividad.
app.autenticacion.minutos-inactividad=${SESION_MINUTOS_INACTIVIDAD:30}
# Tope absoluto de vida de un token, aunque la sesion siga activa.
app.autenticacion.horas-maximas-token=${SESION_HORAS_MAXIMAS:12}
app.autenticacion.jwt-secreto=${JWT_SECRET:cambia-este-secreto-en-produccion-lovely-girl-2026-clave-larga}
# RF-01.8: pagina del frontend a la que lleva el enlace del correo de recuperacion.
app.autenticacion.url-restablecer-contrasena=${FRONTEND_URL:http://localhost:4200}/restablecer-contrasena
app.autenticacion.remitente-correo=${CORREO_REMITENTE:Lovely Girl <no-responder@lovelygirl.com>}

# Cuentas de demostracion (una por rol). Desactivar fuera de desarrollo.
app.demo.habilitado=${DEMO_HABILITADO:true}

# --- Correo (RF-01.8) ---
# En desarrollo, Mailpit (docker-compose) recibe los correos en el puerto 1025
# y los muestra en http://localhost:8025 sin enviarlos de verdad.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- CORS para el frontend Angular en desarrollo ---
# Lista separada por comas. 4201 se incluye porque en este entorno el 4200
# a veces lo ocupa otro proceso ajeno al proyecto.
app.cors.origen-permitido=${CORS_ORIGEN:http://localhost:4200,http://localhost:4201}

# --- F-02 / RF-02.4: imagenes de productos ---
# Carpeta del servidor donde se guardan (relativa a donde se ejecuta el backend)
# y URL con la que el navegador las pide. La carpeta no se versiona (.gitignore).
app.imagenes.directorio=${IMAGENES_DIRECTORIO:uploads/articulos}
app.imagenes.ruta-publica=/imagenes/articulos
# Tope de tamano: Spring corta antes de leer todo el archivo. Debe coincidir con
# ArchivoImagen.TAMANO_MAXIMO_MB (el dominio lo vuelve a validar).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# --- F-05: pedidos ---
# Pagina del frontend para ver un pedido; se usa en el correo de confirmacion (RF-05.6).
app.pedidos.url-detalle=${FRONTEND_URL:http://localhost:4200}/pedido
