spring.application.name=ecommerce

# --- Oracle (contenedor docker-compose en la raiz del repo) ---
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:lovely_girl}
spring.datasource.password=${DB_PASSWORD:LovelyGirl_2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# El esquema lo crea Flyway (db/migration); Hibernate solo valida que coincida
# con las entidades JPA, nunca genera ni altera tablas por su cuenta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# --- JWT (RF-01: la sesion expira tras 30 min) ---
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-en-produccion-lovely-girl-2026-clave-larga}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:30}

# --- CORS para el frontend Angular en desarrollo ---
app.cors.origen-permitido=${CORS_ORIGEN:http://localhost:4200}
