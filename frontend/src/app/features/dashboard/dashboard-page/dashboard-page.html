<header class="barra-superior">
  <h1>Lovely Girl</h1>
  <button type="button" class="btn btn-secundario" (click)="cerrarSesion()">Cerrar sesión</button>
</header>

<main class="contenido">
  @if (usuario(); as datos) {
    <section class="tarjeta-bienvenida">
      <h2>¡Hola, {{ datos.nombre }}! 👋</h2>
      <p class="rol-actual">Rol: <strong>{{ etiquetasRol[datos.rol] }}</strong></p>
      <p class="correo">{{ datos.email }}</p>

      <div class="acciones-dashboard">
        <a routerLink="/" class="btn btn-secundario">Ver catálogo</a>

        @if (esAdministradora()) {
          <a routerLink="/admin/usuarios" class="btn btn-primary">Gestionar usuarios</a>
          <a routerLink="/admin/articulos" class="btn btn-primary">Gestionar productos</a>
        }
      </div>
    </section>
  }
</main>
