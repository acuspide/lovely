<app-barra-superior seccion="Dashboard" />

<main class="contenido">
  @if (usuario(); as datos) {
    <section class="tarjeta">
      <h2>¡Hola, {{ datos.nombre }}!</h2>
      <p class="subtitulo">Panel de administración de Lovely Girl.</p>

      <div class="accesos">
        <a routerLink="/admin/usuarios" class="acceso">
          <strong>Personal</strong>
          <span>Crea, edita y desactiva las cuentas de asesoras y encargadas.</span>
        </a>
        <a routerLink="/admin/articulos" class="acceso">
          <strong>Productos</strong>
          <span>Administra el catálogo de la tienda.</span>
        </a>
        <a routerLink="/" class="acceso">
          <strong>Catálogo</strong>
          <span>Mira la tienda como la ven las clientas.</span>
        </a>
      </div>
    </section>
  }
</main>
