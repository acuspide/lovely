services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: lovely-girl-oracle
    ports:
      - "1521:1521"
    environment:
      # Password del usuario SYSTEM/SYS (solo desarrollo local).
      ORACLE_PASSWORD: LovelyGirl_2026
      # El propio arranque de la imagen crea este usuario/schema de aplicacion
      # dentro del PDB por defecto (FREEPDB1), que es el que usa el backend.
      APP_USER: lovely_girl
      APP_USER_PASSWORD: LovelyGirl_2026
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # RF-01.8: servidor SMTP de desarrollo. Atrapa los correos de recuperacion
  # de contrasena (puerto 1025) y los muestra en http://localhost:8025 sin
  # enviarlos de verdad.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: lovely-girl-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  oracle-data:
